# Runs the validation tests (tests/testthat/test-validation-*.R), which check the
# samplers and simulators against the model as specified, with expected values from
# independent code. They are too slow for R-CMD-check, which skips them. Each group of
# tests runs as its own job, in parallel, so each has GitHub's 6-hour limit to itself:
#   T    T1-T10, the samplers and simulators one at a time (~30 min)
#   M    M1-M6, whole-sampler runs with exact posteriors and Geweke's test (~45 min)
#   S02  S2, recovery of a deaths-model fit (~5 h)
#   S08  S8, recovery of a fit with a share of the tail of the reporting delay for
#        each onset week, four chains in parallel (~4 h)
#   S09  S9, recovery with a fraction dated by death varying by onset week (4 chains
#        in parallel, each stopped at 4.5 h; ~1.5 h)
#   S01  S1, simulation-based calibration (~3 h)
# Pull requests and pushes to main run the medium tier (T and M); the slow tiers run on
# demand: slow adds S02, S08 and S09, all adds S01.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tier:
        description: "Validation tier: fast, medium, slow or all"
        required: true
        default: medium
        type: choice
        options: [fast, medium, slow, all]

name: validation

jobs:
  groups:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - id: groups
        run: |
          case "${{ inputs.tier || 'medium' }}" in
            fast)   groups='["T"]' ;;
            medium) groups='["T", "M"]' ;;
            slow)   groups='["T", "M", "S02", "S08", "S09"]' ;;
            all)    groups='["T", "M", "S02", "S08", "S09", "S01"]' ;;
          esac
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  validation:
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: validation (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # the group's files are chosen by the filter; the tier only has to allow them
      VALIDATION_TIER: all

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # cmdstanr (suggested) is not on CRAN
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run the validation tests
        shell: Rscript {0}
        run: |
          group <- "${{ matrix.group }}"
          cat("Validation group:", group, "\n")
          res <- devtools::test(filter = paste0("validation-", group), reporter = "summary",
                                stop_on_failure = FALSE)
          df <- as.data.frame(res)
          print(df[, c("file", "test", "nb", "failed", "skipped", "error", "real")],
                row.names = FALSE)
          if (any(df$failed > 0) || any(df$error)) stop("validation tests failed")
