# Runs the validation tests (tests/testthat/test-validation-*.R), which check the
# samplers and simulators against the model as specified, with expected values from
# independent code. They are too slow for R-CMD-check, which skips them. Pull requests
# and pushes to main run the fast and medium tiers (about 30 min); the slow tiers
# (S2 about 2.5 h, S1 about 1.5 h more) run on demand.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tier:
        description: "Validation tier: fast, medium, slow or all"
        required: true
        default: medium
        type: choice
        options: [fast, medium, slow, all]

name: validation

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VALIDATION_TIER: ${{ inputs.tier || 'medium' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, local::.
          needs: check

      - name: Run the validation tests
        shell: Rscript {0}
        run: |
          cat("Validation tier:", Sys.getenv("VALIDATION_TIER"), "\n")
          res <- devtools::test(filter = "validation", reporter = "summary",
                                stop_on_failure = FALSE)
          df <- as.data.frame(res)
          print(df[, c("file", "test", "nb", "failed", "skipped", "error", "real")],
                row.names = FALSE)
          if (any(df$failed > 0) || any(df$error)) stop("validation tests failed")
